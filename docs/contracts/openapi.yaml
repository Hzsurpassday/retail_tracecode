        stateReason: { type: string, nullable: true }
        env: { type: string, enum: [LIVE, MOCK] }
        verificationState: { type: string, description: PASSED / FAILED / UNRESOLVED / NONE 等 }
        partCount: { type: integer }
        codeCount: { type: integer, description: 逐码最新结论数（同码多次取最新一行） }
        succeededCodes: { type: integer }
        failedCodes: { type: integer }
        unknownCodes: { type: integer, description: UNKNOWN 单列，绝不并入成功 }
        succeededParts: { type: integer }
        failedParts: { type: integer }
        partialSuccessParts: { type: integer }
        processingParts: { type: integer }
        acceptanceUnknownParts: { type: integer }
        resultUnresolvedParts: { type: integer }
        manualActionParts: { type: integer }
        createdAt: { type: string, format: date-time }
    UploadTaskListResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items, page, pageSize, total, summary]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/UploadTaskRow' } }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            summary: { $ref: '#/components/schemas/UploadTaskSummary' }
        requestId: { type: string }
    UploadTaskDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [retryPathCertified, task, parts, attempts, codeResults, timeline]
          properties:
            retryPathCertified: { type: boolean, description: 'top.retryPathCertified 只读投影（fail-closed，默认 false）；false 时前端必须禁用受控重试' }
            task:
              type: object
              properties:
                taskId: { type: string }
                eventKey: { type: string }
                taskType: { type: string }
                env: { type: string, enum: [LIVE, MOCK] }
                sourceSnapshotId: { type: string, nullable: true }
                predecessorTaskId: { type: string, nullable: true }
                state: { type: string }
                stateReason: { type: string, nullable: true }
                version: { type: integer }
                createdAt: { type: string, format: date-time }
                verificationState: { type: string }
                dependencyState: { type: string }
                matchState: { type: string }
                sourceIntegrity: { type: string }
                payloadHash: { type: string }
            parts:
              type: array
              items:
                type: object
                properties:
                  partId: { type: string }
                  partIndex: { type: integer }
                  billCode: { type: string }
                  state: { type: string }
                  queryCount: { type: integer }
                  nextQueryAt: { type: string, format: date-time, nullable: true }
                  firstSentAt: { type: string, format: date-time, nullable: true }
                  resultRows: { type: integer }
            attempts:
              type: array
              items:
                type: object
                properties:
                  attemptId: { type: string }
                  partId: { type: string, nullable: true }
                  attemptNo: { type: integer }
                  attemptKind: { type: string, enum: [UPLOAD, QUERY] }
                  startedAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time, nullable: true }
                  httpStatus: { type: integer, nullable: true }
                  requestId: { type: string, nullable: true }
                  platformTaskId: { type: string, nullable: true }
                  errorKind: { type: string, nullable: true }
                  isStaleEvidence: { type: boolean, description: 迟到写回只留证不改状态 }
                  rawResponse: { type: string, nullable: true, description: 入库前已脱敏（不含 AppKey/AppSecret/签名/请求参数） }
            codeResults:
              type: array
              items:
                type: object
                properties:
                  resultId: { type: string }
                  partId: { type: string }
                  codeId: { type: string }
                  codeNormalized: { type: string }
                  result: { type: string, enum: [SUCCESS, FAILED, UNKNOWN] }
                  reason: { type: string, nullable: true }
                  attemptId: { type: string }
                  recordedAt: { type: string, format: date-time }
            timeline:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  kind: { type: string, description: 'TASK_CREATED / ATTEMPT_UPLOAD / ATTEMPT_QUERY_FINISHED / 审计 action' }
                  detail: { type: string, nullable: true }
                  actor: { type: string, nullable: true }
        requestId: { type: string }
    ManualVerifyRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [ACCEPTED, PROCESSING, NOT_ACCEPTED] }
        evidence:
          type: object
          properties:
            platformBillCode: { type: string, nullable: true, description: 'ACCEPTED/PROCESSING 必填，且必须等于该任务某分片 bill_code（否则 422 EVIDENCE_MISMATCH）' }
            contractEvidence: { description: 'NOT_ACCEPTED 必填的合同/平台协作证据（非空）；ACCEPTED/PROCESSING 可选' }
        expectedVersion: { type: integer, nullable: true, description: upload_task.version；不一致 409 VERSION_CONFLICT }
    ManualVerifyResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [taskId, state, version, decision, partIds]
          properties:
            taskId: { type: string }
            state: { type: string, description: 人工核对后聚合任务状态 }
            version: { type: integer }
            decision: { type: string, enum: [ACCEPTED, PROCESSING, NOT_ACCEPTED] }
            partIds: { type: array, items: { type: string }, description: 被推进的分片 }
        requestId: { type: string }
    ControlledRetryRequest:
      type: object
      properties:
        expectedVersion: { type: integer, nullable: true, description: upload_task.version；不一致 409 VERSION_CONFLICT }
    ControlledRetryResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [taskId, state, version, retryAllowed, jobsReset, partIds]
          properties:
            taskId: { type: string }
            state: { type: string }
            version: { type: integer }
            retryAllowed: { type: boolean, description: 恒 true（在途发送已在写入前 409 RETRY_IN_FLIGHT 拒绝） }
            jobsReset: { type: integer, description: 复位/新建的 upload-dispatch 作业数 }
            partIds: { type: array, items: { type: string }, description: 被复核的 Failed 分片（成功分片绝不重发） }
        requestId: { type: string }
  responses:
    Unauthorized: { description: 未登录, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 版本/占用/幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: 业务不满足, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: CSRF 令牌缺失/无效（CSRF_INVALID）或请求体畸形（BAD_REQUEST）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 对象不存在或不属于当前门店, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{ cookieAuth: [] }]
paths:
  # ================= M0 已实现端点（真实形状） =================
  /auth/session:
    get:
      x-phase: M0
      security: []
      description: 会话状态与 CSRF 令牌（匿名可达）。已认证时附 username 与权限列表。
      responses:
        '200': { description: 会话与 CSRF 令牌, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/login:
    post:
      x-phase: M0
      security: []
      description: 登录（匿名可达，但必须携带有效 X-CSRF-TOKEN，防登录 CSRF）。失败写审计（actor 超 64 字符截断保存），返回 401 AUTH_FAILED，不区分用户名/密码错误。
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: 登录成功（Set-Cookie .tf.auth）, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      x-phase: M0
      description: 退出登录并写审计。天然幂等（重复退出无副作用），不经幂等执行器；匿名调用亦安全退出。须携带 X-CSRF-TOKEN。
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { description: 已退出, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyDataResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/users:
    post:
      x-phase: M0
      description: >
        创建用户（权限 system:manage）。幂等执行器包裹（API-02）：Idempotency-Key 必填（缺失/超 128 字符 422），
        同键同内容重放原结果，同键不同内容 409 IDEMPOTENCY_CONFLICT；幂等记录与业务同事务。
        用户名重复 409 CONFLICT；用户名空或密码不足 10 位 422 VALIDATION。密码不可逆哈希（AUTH-02）。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '200': { description: 创建成功（含新用户 ID）, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 用户名已存在（CONFLICT）或同幂等键不同请求体（IDEMPOTENCY_CONFLICT）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/users/{id}/permissions:
    post:
      x-phase: M0
      description: 授予/收回权限（权限 system:manage）。未知权限项 422；重复授予幂等（UQ_user_permission）；变更与审计同事务（AUTH-03）。
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GrantPermissionRequest' } } }
      responses:
        '200': { description: 权限已变更, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyDataResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dashboard:
    get:
      x-phase: M0
      description: 待办计数/同步健康（权限 trace:read）。真实 DB 计数：接入异常 OPEN 数、当前 env PENDING 作业数、上传任务按态分组、最近审计时间。只读不触发平台请求（UI-01）。
      responses:
        '200': { description: 待办计数/同步健康/深链条件, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      x-phase: M0
      security: []
      description: 健康检查（匿名）。DB 探测失败仅返回 UNAVAILABLE，不回显连接细节（NFR-05）。
      responses:
        '200': { description: 环境/DB 状态/服务器 UTC 时间, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
  # ================= M1 已实现端点（真实形状）+ M2+ 计划契约（x-phase 标注） =================
  /products:
    get:
      x-phase: M1
      description: 分页商品列表（权限 trace:read）。无密钥字段。
