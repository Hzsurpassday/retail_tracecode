openapi: 3.0.3
info:
  title: TraceFlow 内部 API
  version: 0.1.0
  description: >
    PRD §12 最低资源契约。金额/数量/外部ID/rowversion 一律 JSON 字符串（API-01）。
    变更接口要求 Idempotency-Key 头与 expectedVersion（API-02）。x-phase 标注实现阶段。
    M0/M1 端点（/auth/*、/admin/*、/dashboard、/health、/products、/suppliers、/imports*、
    /product-mappings/*、/supplier-mappings/*、/products/{id}/trace-policy、/sync-jobs、
    /jobs/{id}、/audit-logs、/settings*）、M2 端点（/upstream-bills*、/inbounds*）与
    M3 端点（/pos-sales*、/returns*、/upload-tasks*）均按真实代码形状描述
    （traceflow/src/TraceFlow.Host/Endpoints/*.cs，以代码为准）。
    x-phase 标注契约归属阶段：M0/M1/M2/M3 为已实现；M4 为计划契约（未实现，不提供端点）。
    已认证请求的所有 /api 变更方法（POST/PUT/DELETE/PATCH）必须携带 X-CSRF-TOKEN 头
    （全局 antiforgery 中间件，AUTH-02）；/auth/login 与 /auth/logout 匿名可达但自行校验 CSRF。
    失败统一 code/message/fieldErrors/retryable/requestId；401 未登录、403 无权、
    409 版本/占用/幂等冲突、422 业务不满足、429 调度限额、503 外部不可用（API-01）。
servers: [{ url: /api/v1 }]
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: .tf.auth }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    CsrfToken: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string }, description: 会话 CSRF 令牌（GET /auth/session 获取；AUTH-02） }
    ResourceId: { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 本地实体 bigint ID（内部 ID，非外部 ID） }
  schemas:
    Error:
      type: object
      required: [code, message, retryable, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors: { type: array, items: { type: object }, description: 逐行校验错误（422 ALLOCATION_INVALID 等）；无则空数组 }
        retryable: { type: boolean, description: '可安全重试：仅 429 TOP_RATE_LIMITED 与 409 RETRY_IN_FLIGHT 为 true，其余 false' }
        retryAfter: { type: integer, nullable: true, description: '建议等待秒数（仅 429 且平台/本地给出等待时间时返回；同时写 Retry-After 响应头）' }
        requestId: { type: string }
    PageMeta:
      type: object
      required: [records, total]
      properties:
        records: { type: array, items: { type: object } }
        total: { type: integer }
    ConfirmMappingRequest:
      type: object
      required: [targetId, expectedVersion, reason]
      properties:
        targetId: { type: string }
        expectedVersion: { type: string, description: rowversion 字符串 }
        reason: { type: string }
        evidenceIds: { type: array, items: { type: string } }
    TracePolicyRequest:
      type: object
      required: [classification, reason, expectedVersion]
      properties:
        classification: { type: string, enum: [REQUIRED, EXEMPT] }
        reason: { type: string }
        expectedVersion: { type: string }
    AllocationRequest:
      type: object
      required: [expectedMatchVersion, lines]
      properties:
        expectedMatchVersion: { type: string, description: 'inbound_match.version 整数字符串（AT-067）；不匹配→409 VERSION_CONFLICT' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sourceLineId, upstreamLineId, quantity, unitRatio, codes]
            properties:
              sourceLineId: { type: integer, format: int64, description: 本地 source_line.id（内部 int64 代理，JSON number） }
              upstreamLineId: { type: integer, format: int64 }
              quantity: { type: number, description: 'decimal(18,6) JSON number；>6 位小数或 |v|≥10^12→422 QTY_DOMAIN；非正→QTY_NONPOSITIVE' }
              unitRatio: { type: string, description: '"n/d" 正整数；换算不精确→CONVERSION_INEXACT；换算后数量≠码数→QTY 校验失败' }
              conversionEvidence: { type: string, nullable: true, description: 比例≠1/1 时必填（CONVERSION_EVIDENCE_REQUIRED） }
              codes: { type: array, items: { type: string }, description: 须属该上游行、全 MIN、S8P20、集合内无重复/父子关系；大码→BIG_CODE_BLOCKED }
    ReturnConfirmRequest:
      type: object
      required: [expectedVersion, decision, evidence, idemKey]
      properties:
        expectedVersion: { type: integer, format: int64, description: 'upload_task.version 乐观版本（内部 int64，JSON number）；不匹配 409 VERSION_CONFLICT' }
        decision: { type: string, enum: [CONFIRMED, REJECTED], description: 'CONFIRMED=确认并提升为可发送任务；REJECTED=驳回（占位任务保持 Blocked，原因 RETURN_CONFIRM_REJECTED）' }
        predecessorEventIds:
          type: array
          items: { type: integer, format: int64 }
          description: '前序 code_event.id 集合；仅回显，服务端锁定后重新解析并以服务端结论为准（与提交值不一致→422 PREDECESSOR_MISMATCH）'
        evidence: { description: '确认/驳回证据（JSON 对象、数组或字符串，必填非空；落 return_confirmation.evidence_json）' }
        idemKey: { type: string, description: '幂等键（请求体内，非 Idempotency-Key 头；按用户作用域命名空间化落 idempotency_record；同一键重放返回 Idempotent=true）' }
        firstReportDeclared: { type: boolean, description: '首次上报声明：decision=CONFIRMED 时必填且必须为 true（否则 422 FIRST_REPORT_NOT_DECLARED）；REJECTED 忽略。服务端把 "firstReportDeclared":true 并入 evidence_json（保留原证据内容）并进入审计 before/after' }
    TaskActionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        expectedVersion: { type: string }
    # ---- M0 已实现端点的真实请求/响应形状（TraceFlow.Host/Endpoints/*.cs） ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: 必填非空；重复用户名 409 CONFLICT }
        password: { type: string, minLength: 10, description: 至少 10 位，否则 422 VALIDATION }
        displayName: { type: string, nullable: true }
        reason: { type: string, nullable: true, description: 审计原因（AUD-01） }
    GrantPermissionRequest:
      type: object
      required: [permission, grant]
      properties:
        permission: { type: string, description: PermissionCatalog 权限项（如 trace:read、system:manage）；未知权限 422 }
        grant: { type: boolean, description: true 授予 / false 收回；重复授予幂等 }
        reason: { type: string, nullable: true }
    SessionResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [authenticated, csrfToken]
          properties:
            authenticated: { type: boolean }
            username: { type: string, description: 仅已认证时返回 }
            permissions: { type: array, items: { type: string }, description: 仅已认证时返回 }
            csrfToken: { type: string }
        requestId: { type: string }
    LoginResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [username]
          properties:
            username: { type: string }
        requestId: { type: string }
    CreateUserResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id: { type: integer, format: int64, description: 本地 app_user bigint ID（内部 ID 以 JSON number 返回；API-01 字符串规则针对外部 ID/金额/数量/rowversion） }
        requestId: { type: string }
    EmptyDataResponse:
      type: object
      required: [data, requestId]
      properties:
        data: { type: object }
        requestId: { type: string }
    DashboardResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [env, openIngestExceptions, pendingJobs, uploadTasksByState]
          properties:
            env: { type: string, enum: [LIVE, MOCK], description: 当前环境（配置大小写不敏感，启动规范化为 LIVE/MOCK；默认 MOCK，LIVE 须门禁后显式开启） }
            openIngestExceptions: { type: integer, description: ingest_exception status=OPEN 计数 }
            pendingJobs: { type: integer, description: 当前 env 下 outbox_job PENDING 计数 }
            uploadTasksByState: { type: object, additionalProperties: { type: integer }, description: 当前 env 下 upload_task 按 state 分组计数 }
            lastActivityUtc: { type: string, format: date-time, nullable: true, description: audit_log 最近 occurred_at（UTC） }
        requestId: { type: string }
    HealthResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [env, db, serverTimeUtc]
          properties:
            env: { type: string, enum: [LIVE, MOCK] }
            db: { type: string, enum: [OK, UNAVAILABLE], description: 不回显连接细节（NFR-05） }
            serverTimeUtc: { type: string, format: date-time }
        requestId: { type: string }
    # ---- M1+ 计划契约请求体 ----
    ImportRequest:
      type: object
      required: [fileKind, fileHash, content]
      properties:
        fileKind: { type: string, enum: [PRODUCT, SUPPLIER, PLATFORM_DRUG, ENTERPRISE], description: 导入类型（决定 CSV 列模板与目标表） }
        fileName: { type: string }
        fileHash: { type: string, description: 文件 SHA-256 摘要字符串；同导入意图幂等（MD-03） }
        content: { type: string, description: 上传内容（Base64）；默认边界 20 MB/10000 行，超限 422 要求拆批 }
    CommitImportRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: string, description: rowversion 字符串 }
        reason: { type: string }
    SyncJobRequest:
      type: object
      required: [entity, start, end]
      properties:
        entity: { type: string, enum: [sale, purchase-in, upstream, enterprise], description: 同步实体（有界枚举；upstream/enterprise 为 M2 新增） }
        start: { type: string, format: date-time, description: 窗口起点（有界参数，超限 422） }
        end: { type: string, format: date-time }
        filters: { type: object, description: 可选过滤条件 }
    ConfirmAllocationRequest:
      type: object
      required: [expectedMatchVersion]
      properties:
        expectedMatchVersion: { type: string, description: inbound_match.version 整数字符串 }
    ReconciliationRequest:
      type: object
      required: [windowStart, windowEnd, businessType]
      properties:
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        businessType: { type: string, description: 业务类型（有界枚举） }
    ConnectionTestRequest:
      type: object
      required: [configId]
      properties:
        configId: { type: integer, format: int64, description: 仅接受已保存配置 ID；拒绝任意连接目标（NFR-05，防 SSRF） }
    SettingUpdateRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        valueJson: { type: string, nullable: true, description: 非敏感配置 JSON 文本 }
        secretValue: { type: string, nullable: true, writeOnly: true, description: 敏感字段只写不回显（AUTH-01/NFR-05） }
        expectedVersion: { type: string, description: rowversion 字符串 }
        reason: { type: string }
    JobAccepted:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [jobId]
          properties:
            jobId: { type: string, description: 'outbox_job 作业 ID 字符串；GET /jobs/{id} 查询进度' }
        requestId: { type: string }
    # ---- M2 已实现端点真实响应形状（T15 回写） ----
    AllocationSaveResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [matchVersion, allocationsSaved, allRequiredCovered]
          properties:
            matchVersion: { type: integer, description: 保存后 inbound_match.version }
            allocationsSaved: { type: integer }
            allRequiredCovered: { type: boolean, description: 全部 REQUIRED 行覆盖→COMPLETE，否则 PARTIAL }
        requestId: { type: string }
    ConfirmAllocationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [taskId, billCode, matchVersion, reused, message]
          properties:
            taskId: { type: string, description: upload_task.id 字符串 }
            billCode: { type: string, description: 平台单据号（top.billPrefix 前缀，默认 TF；复用/重激活时不变） }
            matchVersion: { type: integer }
            reused: { type: boolean, description: true=复用既有任务或 Cancelled 重激活（单据号不变） }
            message: { type: string, description: 固定文案"符合资格后将自动上传" }
        requestId: { type: string }
    CancelAllocationRequest:
      type: object
      required: [reason]
      properties:
        allocationId: { type: integer, format: int64, nullable: true, description: null=取消全部暂存分配并回退发送前任务；单行 COMMITTED=整单发送前取消 }
        reason: { type: string }
    CancelAllocationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [cancelled]
          properties:
            cancelled: { type: integer }
        requestId: { type: string }
    MappingResolveResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [mappingId, state, version, mappingVersion]
          properties:
            mappingId: { type: string }
            state: { type: string, description: 改绑成功恒 MANUAL_CONFIRMED（is_locked=1） }
            version: { type: string, description: 新 rowversion hex }
            mappingVersion: { type: integer }
        requestId: { type: string }
    ServiceAccountResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [serviceAccount, machineName]
          properties:
            serviceAccount: { type: string, description: '进程身份 DOMAIN\user（Windows 服务即运行账号，§4.7）' }
            machineName: { type: string }
        requestId: { type: string }
    TopBudgetsResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [budgets, pauses]
          properties:
            budgets:
              type: array
              items:
                type: object
                properties:
                  budgetKey: { type: string, description: 'appkey:total / method:{m} / ent:{ref}:method:{m}' }
                  dayCount: { type: integer }
                  dayWindowStart: { type: string, format: date-time, nullable: true, description: '日窗口起点（UTC）；仅当该窗口仍活跃时返回，否则 null 且 dayCount 出网为 0（读时评估，库内计数不清零）' }
                  dayLimit: { type: integer, nullable: true, description: null=本地不设帽（G-TOP 未取证不虚构限值） }
                  minuteCount: { type: integer }
                  minuteWindowStart: { type: string, format: date-time, nullable: true, description: '分钟窗口起点（UTC）；窗口不活跃时为 null' }
                  minuteLimit: { type: integer, nullable: true }
                  secondCount: { type: integer }
                  secondWindowStart: { type: string, format: date-time, nullable: true, description: '秒窗口起点（UTC）；窗口不活跃时为 null' }
                  secondLimit: { type: integer, nullable: true }
                  nextAllowedAtUtc: { type: string, format: date-time, nullable: true }
            pauses:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  scopeKey: { type: string }
                  reason: { type: string }
                  isActive: { type: boolean }
                  pausedAtUtc: { type: string, format: date-time }
                  pausedBy: { type: string }
                  resumedAtUtc: { type: string, format: date-time, nullable: true }
                  resumedBy: { type: string, nullable: true }
        requestId: { type: string }
    # ---- M1 已实现端点真实响应形状（T16 回写） ----
    SettingView:
      type: object
      required: [id, key, isSecret, hasSecretValue, version]
      properties:
        id: { type: integer, format: int64, description: app_setting 本地 ID（JSON number，内部 int64 代理）；未持久化为 0 }
        key: { type: string }
        valueJson: { type: string, nullable: true, description: 非密钥配置 JSON 文本；密钥键恒 null }
        isSecret: { type: boolean }
        hasSecretValue: { type: boolean, description: 是否已保存密钥密文（不回显明文） }
        version: { type: string, description: rowversion 字符串；未持久化为 "0" }
        updatedBy: { type: string, nullable: true }
        updatedAtUtc: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        protectionScope: { type: string, nullable: true, description: DPAPI 保护作用域；密钥保存后为 CurrentUser，非密钥 null（§4.7） }
    SettingsListResponse:
      type: object
      required: [data, requestId]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SettingView' } }
        requestId: { type: string }
    SettingUpdateResponse:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/SettingView' }
        requestId: { type: string }
    ConnectionTestResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [ok, message]
          properties:
            ok: { type: boolean }
            message: { type: string, description: 连接结果描述（不回显凭据/连接串） }
        requestId: { type: string }
    ImportBatchView:
      type: object
      required: [batchId, fileKind, fileName, fileHash, totalRows, successRows, failedRows, status, version]
      properties:
        batchId: { type: string }
        fileKind: { type: string, enum: [PRODUCT, SUPPLIER, PLATFORM_DRUG, ENTERPRISE] }
        fileName: { type: string }
        fileHash: { type: string }
        totalRows: { type: integer }
        successRows: { type: integer }
        failedRows: { type: integer }
        status: { type: string, enum: [STAGED, COMMITTED, FAILED] }
        version: { type: string, description: rowversion 字符串 }
        stagedBy: { type: string }
        stagedAt: { type: string, format: date-time }
        committedBy: { type: string, nullable: true }
        committedAt: { type: string, format: date-time, nullable: true }
    ImportAccepted:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [jobId, batchId]
          properties:
            jobId: { type: string, description: 'import-stage 作业 ID；已提交/失败批次返回 "0"（不产生作业）' }
            batchId: { type: string }
        requestId: { type: string }
    ImportPreviewResponse:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/ImportBatchView' }
        requestId: { type: string }
    ImportDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [batch, rows, total, page, pageSize]
          properties:
            batch: { $ref: '#/components/schemas/ImportBatchView' }
            rows:
              type: array
              items:
                type: object
                required: [rowNumber, status, rawJson]
                properties:
                  rowNumber: { type: integer }
                  status: { type: string, enum: [OK, ERROR, APPLIED] }
                  error: { type: string, nullable: true }
                  rawJson: { type: string }
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
        requestId: { type: string }
    ImportCommitResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [appliedRows, status]
          properties:
            appliedRows: { type: integer }
            status: { type: string, enum: [COMMITTED] }
        requestId: { type: string }
    MappingActionResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [mappingId, state, version, mappingVersion]
          properties:
            mappingId: { type: string }
            state: { type: string, enum: [MANUAL_CONFIRMED, DISABLED] }
            version: { type: string, description: 新 rowversion 字符串 }
            mappingVersion: { type: integer, description: 新 int 乐观版本 }
        requestId: { type: string }
    DisableMappingRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: string }
        reason: { type: string, maxLength: 500 }
    TracePolicyResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [productId, traceClassification, classificationReason, version, affectedNonTerminalTasks]
          properties:
            productId: { type: string }
            traceClassification: { type: string, enum: [REQUIRED, EXEMPT] }
            classificationReason: { type: string }
            affectedNonTerminalTasks: { type: integer, description: 关联非终态任务数；M1 恒 0（无任务产生路径），失效接线 M2 }
            version: { type: string, description: 新商品 rowversion 字符串 }
        requestId: { type: string }
    ProductMappingView:
      type: object
      required: [mappingId, state, isLocked, mappingVersion, version, platformDrugId]
      properties:
        mappingId: { type: string }
        state: { type: string }
        isLocked: { type: boolean }
        mappingVersion: { type: integer }
        version: { type: string }
        platformDrugId: { type: string }
        approvalNoNorm: { type: string, nullable: true }
        manufacturerIdentity: { type: string, nullable: true }
        dosageForm: { type: string, nullable: true }
        strength: { type: string, nullable: true }
        packageSpec: { type: string, nullable: true }
    ProductsResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [records, total, page, pageSize]
          properties:
            records:
              type: array
              items:
                type: object
                required: [productId, spid, name, traceClassification, version, mappingState]
                properties:
                  productId: { type: string }
                  spid: { type: string }
                  displayCode: { type: string, nullable: true }
                  barcode: { type: string, nullable: true }
                  name: { type: string }
                  approvalNoRaw: { type: string, nullable: true }
                  approvalNoNorm: { type: string, nullable: true }
                  manufacturerRaw: { type: string, nullable: true }
                  manufacturerIdentity: { type: string, nullable: true }
                  dosageForm: { type: string, nullable: true }
