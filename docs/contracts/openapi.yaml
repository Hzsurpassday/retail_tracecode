    UploadTaskRow:
      type: object
      required: [id, eventKey, taskType, state, env, partCount, codeCount]
      properties:
        id: { type: string }
        eventKey: { type: string }
        taskType: { type: string, enum: [PURCHASE_IN_102, RETAIL_321, CONSUMER_RETURN_116, PURCHASE_RETURN_202] }
