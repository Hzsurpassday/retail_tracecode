        eventCount: { type: integer, description: 筛选后事件数 }
        latestEventType: { type: string, nullable: true, enum: [PURCHASE_IN, SALE, CONSUMER_RETURN, PURCHASE_RETURN] }
        claimState: { type: string, enum: [ACTIVE, RELEASED, NONE], description: 激活占用优先，否则曾释放，否则无占用 }
        claimScope: { type: string, nullable: true, description: 当前展示占用的 event_scope }
        billCode: { type: string, nullable: true, description: 激活占用任务任一 分片 bill_code（仅 ACTIVE；无则 null） }
    CodeLedgerListResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items, page, pageSize, total, env]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CodeLedgerRow' } }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer, description: 同过滤条件的独立 COUNT（无事件的码不计） }
            env: { type: string, enum: [LIVE, MOCK], description: 实际查询环境 }
        requestId: { type: string }
    CodeLedgerDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [code, events, claims, results, confirmations, relations]
          properties:
            code:
              type: object
              required: [code, codeRaw, format, firstSeenAt, env]
              properties:
                code: { type: string }
                codeRaw: { type: string }
                format: { type: string }
                firstSeenAt: { type: string, format: date-time }
                env: { type: string, enum: [LIVE, MOCK] }
            events:
              type: array
              description: 升序 occurred_at,id；上限 500
              items:
                type: object
                required: [eventId, eventType, direction, occurredAt, sourceLineId]
                properties:
                  eventId: { type: string, description: 内部事件 id（API-01 字符串） }
                  eventType: { type: string, enum: [PURCHASE_IN, SALE, CONSUMER_RETURN, PURCHASE_RETURN] }
                  direction: { type: string, enum: [IN, OUT] }
                  occurredAt: { type: string, format: date-time }
                  businessDatetime: { type: string, format: date-time, nullable: true }
                  sourceSnapshotId: { type: integer, format: int64, nullable: true, description: JSON number（与 M2/M3 一致） }
                  sourceLineId: { type: integer, format: int64, description: 0 = 外部证据事件（无本地来源行） }
                  uploadTaskId: { type: integer, format: int64, nullable: true, description: JSON number }
                  predecessorEventId: { type: string, nullable: true, description: 前序事件 id（字符串）；无则 null }
            claims:
              type: array
              description: 升序 claimed_at；上限 200
              items:
                type: object
                properties:
                  claimState: { type: string, enum: [ACTIVE, RELEASED] }
                  eventScope: { type: string }
                  uploadTaskId: { type: integer, format: int64, nullable: true }
                  claimedAt: { type: string, format: date-time }
                  releasedAt: { type: string, format: date-time, nullable: true }
                  releasedBy: { type: string, nullable: true }
            results:
              type: array
              description: recorded_at DESC,id DESC；上限 200；不含 platform_evidence/raw_response
              items:
                type: object
                required: [taskId, result, recordedAt]
                properties:
                  taskId: { type: string }
                  result: { type: string, enum: [SUCCESS, FAILED, UNKNOWN] }
                  reason: { type: string, nullable: true }
                  recordedAt: { type: string, format: date-time }
                  billCode: { type: string, description: 同 task+env 分片账单码 }
                  partState: { type: string }
                  taskState: { type: string }
                  requestId: { type: string, nullable: true, description: upload_attempt.request_id }
                  httpStatus: { type: integer, nullable: true }
            confirmations:
              type: array
              description: 该码关联任务的 return_confirmation（同 env）；confirmed_at DESC；上限 50
              items:
                type: object
                required: [taskId, decision, relationKind, confirmedBy, confirmedAt]
                properties:
                  taskId: { type: string }
                  decision: { type: string, enum: [CONFIRMED, REJECTED] }
                  relationKind: { type: string, enum: [SALE, PURCHASE_IN] }
                  predecessorTaskId: { type: string, nullable: true }
                  confirmedBy: { type: string }
                  confirmedAt: { type: string, format: date-time }
            relations:
              type: object
              required: [parents, children]
              properties:
                parents: { type: array, description: 本码为 child 的父码（上限 100）, items: { $ref: '#/components/schemas/CodeRelationRow' } }
                children: { type: array, description: 本码为 parent 的子码（上限 100）, items: { $ref: '#/components/schemas/CodeRelationRow' } }
        requestId: { type: string }
    CodeRelationRow:
      type: object
      required: [code, relationSource, observedAt]
      properties:
        code: { type: string }
        relationSource: { type: string }
        observedAt: { type: string, format: date-time }
    # ---- M4 统一异常队列（spec §4.2） ----
    ExceptionQueueItem:
      type: object
      required: [category, id, status, title, detailSnippet, createdAt]
      properties:
        category: { type: string, enum: [INGEST, RECON, TASK, MAPPING] }
        id: { type: string, description: '类内唯一键：INGEST/RECON/TASK 为十进制 id；MAPPING 为 product:{product_mapping.id} 或 supplier:{supplier_mapping.id}' }
        status: { type: string, enum: [OPEN, RESOLVED], description: 'TASK/MAPPING 恒 OPEN' }
        title: { type: string, description: 'INGEST=exception_type；RECON=diff_type；TASK=state；MAPPING=商品映射冲突/供应商映射冲突' }
        detailSnippet: { type: string, maxLength: 200, description: '去敏原文截断（≤200）：INGEST=detail、RECON=next_action、TASK=state_reason、MAPPING=名称' }
        objectRef: { type: string, nullable: true, description: 'INGEST=source_document_key；RECON=object_ref；TASK=event_key；MAPPING=spid/dwbh' }
        createdAt: { type: string, format: date-time, nullable: true, description: 'RECON=found_at；TASK=created_at；MAPPING=product.updated_at（供应商映射无时间列 → null，不臆造）' }
        env: { type: string, nullable: true, description: 'RECON/TASK 为行 env；INGEST/MAPPING 恒 null' }
        deepLink: { type: string, nullable: true, description: 'INGEST=/imports；TASK=/uploads?taskId={id}&env={env}；MAPPING=/products 或 /suppliers；RECON=null（详情抽屉即解决面）' }
    ExceptionQueueCounts:
      type: object
      required: [ingestOpen, reconOpen, taskOpen, mappingOpen]
      properties:
        ingestOpen: { type: integer, description: 全量 OPEN 计数（不受分页与 status 过滤影响） }
        reconOpen: { type: integer, description: 宿主 env 作用域内 OPEN 差异数 }
        taskOpen: { type: integer, description: 'ManualAction/ResultUnresolved/AcceptanceUnknown，宿主 env 作用域' }
        mappingOpen: { type: integer, description: 'product_mapping + supplier_mapping 的 CONFLICT 数' }
    ExceptionQueueListResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items, counts, page, pageSize, total, env]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ExceptionQueueItem' } }
            counts: { $ref: '#/components/schemas/ExceptionQueueCounts' }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            env: { type: string, enum: [LIVE, MOCK], description: 列表作用环境（仅 RECON/TASK 受影响） }
        requestId: { type: string }
    ExceptionQueueDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [item, detail]
          properties:
            item: { $ref: '#/components/schemas/ExceptionQueueItem' }
            detail:
              type: object
              description: '按类别：INGEST {detailText≤4000, resolutionEvidence, resolvedBy/resolvedAt}；RECON {diffType,severity,objectRef,ownerRole,nextAction,evidence(解析 JSON) 或 evidenceText(超长/非 JSON 时纯文本≤4000),resolutionEvidence 或 resolutionEvidenceText,run{runId,env,windowStart,windowEnd,businessType,status,startedAt,finishedAt}}；TASK {state,stateReason,taskType,eventKey,env,createdAt,version,attempts[≤5]{attemptKind,attemptNo,httpStatus,requestId,startedAt,finishedAt}}（绝不含 raw_response）；MAPPING {side,local,platform,mapping,evidence 或 evidenceText≤4000}'
        requestId: { type: string }
    ExceptionResolveRequest:
      type: object
      required: [resolutionEvidence]
      properties:
        resolutionEvidence: { type: string, description: '留证，必填且 ≤4000 字符' }
    ExceptionResolveResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [category, id, status, resolvedAt]
          properties:
            category: { type: string, enum: [INGEST, RECON] }
            id: { type: string }
            status: { type: string, enum: [RESOLVED] }
            resolvedAt: { type: string, format: date-time }
        requestId: { type: string }
    # ---- M4 Task 5 可观测性只读面（以 OpsStatusEndpoints.cs 为准） ----
    OpsMetricsResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [env, jobs, attempts24h, uploadsToday, perJobKind, rateBudget, pauses, leaseRecoveries24h, recon]
          properties:
            env: { type: string, enum: [LIVE, MOCK] }
            jobs:
              type: object
              properties:
                pending: { type: integer }
                running: { type: integer }
                done: { type: integer }
                failed: { type: integer }
                cancelled: { type: integer }
                backlog: { type: integer, description: 等于 pending }
                oldestPendingAgeSeconds: { type: integer, description: 'PENDING 最小 next_run_at 距 now 的秒数；未来时间或空闲 → 0' }
                failureRate24h: { type: number, nullable: true, description: 'finished_at>=now-24h 的 FAILED/(DONE+FAILED)，保留 4 位小数；分母 0 → null' }
            attempts24h:
              type: object
              properties:
                upload: { type: integer, description: 'upload_attempt.attempt_kind=UPLOAD 且 started_at>=now-24h' }
                query: { type: integer, description: 'upload_attempt.attempt_kind=QUERY 且 started_at>=now-24h' }
            uploadsToday:
              type: object
              properties:
                total: { type: integer }
                succeeded: { type: integer }
                failed: { type: integer }
                successRate: { type: number, nullable: true, description: 'succeeded/(succeeded+failed)；分母 0 → null' }
            perJobKind:
              type: array
              items:
                type: object
                properties:
                  jobKind: { type: string }
                  backlog: { type: integer, description: 该类型 PENDING 数 }
                  lastDoneAtUtc: { type: string, format: date-time, nullable: true, description: 该类型最近 DONE 的 finished_at }
            rateBudget:
              type: array
              description: 本 env 全部行原样回显；limit 为 null 表示本地未设帽（前端显示"未取证"），不计算/不虚构限值
              items:
                type: object
                properties:
                  budgetKey: { type: string }
                  dayCount: { type: integer }
                  dayLimit: { type: integer, nullable: true }
                  minuteCount: { type: integer }
                  minuteLimit: { type: integer, nullable: true }
                  secondCount: { type: integer }
                  secondLimit: { type: integer, nullable: true }
                  nextAllowedAtUtc: { type: string, format: date-time, nullable: true }
            pauses:
              type: array
              description: top_channel_pause is_active=1（本 env），按 scope_key 升序
              items:
                type: object
                properties:
                  scopeKey: { type: string }
                  reason: { type: string }
                  pausedAtUtc: { type: string, format: date-time }
                  pausedBy: { type: string }
            leaseRecoveries24h: { type: integer, description: 'audit_log action=job.lease.recovered 且 env=宿主 env、occurred_at>=now-24h（回收审计按作业 env 落库）' }
            recon:
              type: object
              properties:
                incomplete24h: { type: integer, description: 本 env 且 started_at>=now-24h 的 INCOMPLETE 运行数 }
                openDifferences: { type: integer, description: 本 env 的 OPEN 差异全量计数（不限时间） }
        requestId: { type: string }
    OpsJobsResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items, page, pageSize, total, env]
          properties:
            items:
              type: array
              items:
                type: object
                required: [jobId, jobKind, jobState, attemptCount, maxAttempts, createdAtUtc]
                properties:
                  jobId: { type: string, description: outbox_job.id（本地 int64 以字符串返回） }
                  jobKind: { type: string }
                  jobState: { type: string, enum: [PENDING, RUNNING, DONE, FAILED, CANCELLED] }
                  attemptCount: { type: integer }
                  maxAttempts: { type: integer }
                  nextRunAtUtc: { type: string, format: date-time }
                  lastError: { type: string, nullable: true, description: 'LEFT(last_error,200)' }
                  createdAtUtc: { type: string, format: date-time }
                  finishedAtUtc: { type: string, format: date-time, nullable: true }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            env: { type: string, enum: [LIVE, MOCK] }
        requestId: { type: string }
    OpsAlert:
      type: object
      required: [code, severity, title, detail, count, deepLink]
      properties:
        code: { type: string, enum: [CHANNEL_PAUSED, LEASE_RECOVERED_24H, JOB_BACKLOG_HIGH, JOBS_FAILED_24H, RECON_INCOMPLETE_24H, RECON_DIFFERENCES_OPEN, RATE_BUDGET_WAITING] }
        severity: { type: string, enum: [HIGH, MEDIUM] }
        title: { type: string }
        detail: { type: string, description: 站内可读说明（时间按 Asia/Shanghai 标注），不含密钥/原始平台响应 }
        count: { type: integer }
        deepLink: { type: string, description: '站内可达面（如 /ops、/ops?state=FAILED、/audit、/exceptions?category=RECON）' }
    OpsAlertsResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [env, alerts]
          properties:
            env: { type: string, enum: [LIVE, MOCK] }
            alerts:
              type: array
              description: 无告警 → 空数组（不返回"一切正常"伪告警）
              items: { $ref: '#/components/schemas/OpsAlert' }
        requestId: { type: string }
  responses:
    Unauthorized: { description: 未登录, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 版本/占用/幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: 业务不满足, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: CSRF 令牌缺失/无效（CSRF_INVALID）或请求体畸形（BAD_REQUEST）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 对象不存在或不属于当前门店, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{ cookieAuth: [] }]
paths:
  # ================= M0 已实现端点（真实形状） =================
  /auth/session:
    get:
      x-phase: M0
      security: []
      description: 会话状态与 CSRF 令牌（匿名可达）。已认证时附 username 与权限列表。
      responses:
        '200': { description: 会话与 CSRF 令牌, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/login:
    post:
      x-phase: M0
      security: []
      description: 登录（匿名可达，但必须携带有效 X-CSRF-TOKEN，防登录 CSRF）。失败写审计（actor 超 64 字符截断保存），返回 401 AUTH_FAILED，不区分用户名/密码错误。
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: 登录成功（Set-Cookie .tf.auth）, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      x-phase: M0
      description: 退出登录并写审计。天然幂等（重复退出无副作用），不经幂等执行器；匿名调用亦安全退出。须携带 X-CSRF-TOKEN。
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { description: 已退出, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyDataResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/users:
    post:
      x-phase: M0
      description: >
        创建用户（权限 system:manage）。幂等执行器包裹（API-02）：Idempotency-Key 必填（缺失/超 128 字符 422），
        同键同内容重放原结果，同键不同内容 409 IDEMPOTENCY_CONFLICT；幂等记录与业务同事务。
        用户名重复 409 CONFLICT；用户名空或密码不足 10 位 422 VALIDATION。密码不可逆哈希（AUTH-02）。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '200': { description: 创建成功（含新用户 ID）, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 用户名已存在（CONFLICT）或同幂等键不同请求体（IDEMPOTENCY_CONFLICT）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/users/{id}/permissions:
    post:
      x-phase: M0
      description: 授予/收回权限（权限 system:manage）。未知权限项 422；重复授予幂等（UQ_user_permission）；变更与审计同事务（AUTH-03）。
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GrantPermissionRequest' } } }
      responses:
        '200': { description: 权限已变更, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyDataResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dashboard:
    get:
      x-phase: M0
      description: 待办计数/同步健康（权限 trace:read）。真实 DB 计数：接入异常 OPEN 数、当前 env PENDING 作业数、上传任务按态分组、最近审计时间。只读不触发平台请求（UI-01）。
      responses:
        '200': { description: 待办计数/同步健康/深链条件, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      x-phase: M0
      security: []
      description: 健康检查（匿名）。DB 探测失败仅返回 UNAVAILABLE，不回显连接细节（NFR-05）。
      responses:
        '200': { description: 环境/DB 状态/服务器 UTC 时间, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
  # ================= M1 已实现端点（真实形状）+ M2+ 计划契约（x-phase 标注） =================
  /products:
    get:
      x-phase: M1
      description: 分页商品列表（权限 trace:read）。无密钥字段。
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' },
        { name: keyword, in: query, schema: { type: string } },
        { name: classification, in: query, schema: { type: string, enum: [UNKNOWN, REQUIRED, EXEMPT] } },
        { name: mappingState, in: query, schema: { type: string } }]
      responses:
        '200': { description: 分页商品, content: { application/json: { schema: { $ref: '#/components/schemas/ProductsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /suppliers:
    get:
      x-phase: M1
      description: 分页供应商列表（权限 trace:read）。dwbh/名称/信用代码/平台稳定 ID/审核/匹配态；无密钥。
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' },
        { name: keyword, in: query, schema: { type: string } },
        { name: mappingState, in: query, schema: { type: string } }]
      responses:
        '200': { description: 分页供应商, content: { application/json: { schema: { $ref: '#/components/schemas/SuppliersResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports:
    get:
      x-phase: M1
      description: 按 (fileKind,fileHash) 定位批次预览（权限 master:match）。上传暂存完成后返回批次摘要与版本。fileHash 大小写不敏感（查询归一化为大写 hex）。
      parameters:
        - { name: fileKind, in: query, required: true, schema: { type: string, enum: [PRODUCT, SUPPLIER, PLATFORM_DRUG, ENTERPRISE] } }
        - { name: fileHash, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 批次摘要, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreviewResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      x-phase: M1
      description: 导入先暂存预览（权限 master:match，MD-03）。202 返回 jobId/batchId（均字符串）；文件摘要幂等（UQ_import_intent）；已提交/失败批次重复上传返回 jobId="0"（不产生作业）；超默认 20 MB/10000 行边界 422 要求拆批。
