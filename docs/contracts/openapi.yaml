  # ================= M4 统一异常队列（spec §4.2） =================
  /exceptions:
    get:
      x-phase: M4
      description: >
        统一异常队列（权限 trace:read）。四类聚合：INGEST=ingest_exception（无 env，org 作用域）；
        RECON=reconciliation_difference JOIN reconciliation_run（env=run.env）；TASK=upload_task 的
        ManualAction/ResultUnresolved/AcceptanceUnknown（恒 OPEN）；MAPPING=product_mapping/supplier_mapping
        的 CONFLICT（恒 OPEN）。UNION ALL 后按 createdAt DESC（NULL 置后）、category、id 排序，
        ROW_NUMBER 区间分页（2008 R2）。counts 为全量 OPEN 计数：不受分页与 status 过滤影响；
        RECON/TASK 受 env 定界，INGEST/MAPPING 无 env。只读，无副作用。
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [INGEST, RECON, TASK, MAPPING] }, description: '非法值 400 VALIDATION（大小写不敏感）' }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED], default: OPEN }, description: 'TASK/MAPPING 只有 OPEN，RESOLVED 过滤自然为空' }
        - { $ref: '#/components/parameters/Page' }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, default: 50 }, description: '1..100；>100 收敛为 100' }
        - { name: env, in: query, schema: { type: string, enum: [LIVE, MOCK] }, description: '仅影响 RECON/TASK；默认宿主 env；非法值 400' }
      responses:
        '200': { description: 统一队列分页, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionQueueListResponse' } } } }
        '400': { description: 'VALIDATION（category/status/env/page/pageSize 非法）', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exceptions/{category}/{id}:
    get:
      x-phase: M4
      description: >
        统一队列详情（权限 trace:read）。item 与列表同一行形状；detail 按类别：INGEST 完整 detail（≤4000）；
        RECON evidence/resolutionEvidence 解析 JSON（超长或非 JSON 时改以 evidenceText 纯文本 ≤4000，截断不产生
        非法 JSON）+ run 窗口/类型/状态；TASK state/stateReason/taskType/eventKey 与最近 5 次 upload_attempt
        （attempt_kind/attempt_no/http_status/request_id/started_at/finished_at，不含 raw_response）；
        MAPPING 本地与平台身份并排 + evidence_json（≤4000）。404 规则：INGEST 按 org；RECON 按 org+宿主 env
        （跨 env 404）；TASK 按 org+env；MAPPING 仅 state=CONFLICT（已非冲突 → 404）。category 非法 400。
        任何原始平台响应/密钥不入响应。
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, enum: [INGEST, RECON, TASK, MAPPING] } }
        - { name: id, in: path, required: true, schema: { type: string }, description: 'INGEST/RECON/TASK 十进制 id；MAPPING 为 product:{id} 或 supplier:{id}' }
        - { name: env, in: query, schema: { type: string, enum: [LIVE, MOCK] }, description: 'RECON/TASK 详情环境；默认宿主 env' }
      responses:
        '200': { description: 队列项详情, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionQueueDetailResponse' } } } }
        '400': { description: 'VALIDATION（category 非法或 env 非法）', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exceptions/{category}/{id}/resolve:
    post:
      x-phase: M4
      description: >
        留证关闭（权限 system:manage）。仅 INGEST/RECON 可在此解析：resolutionEvidence 非空且 ≤4000；
        仅 OPEN→RESOLVED。INGEST 不存在 404、已解决 409 ALREADY_RESOLVED；RECON 与
        /reconciliation-differences/{id}/resolve 同语义（宿主 env 定界，跨 env 404；已解决 409
        DIFFERENCE_ALREADY_RESOLVED）。TASK/MAPPING → 422 NOT_RESOLVABLE_VIA_QUEUE，fieldErrors 附 deepLink
        （处置仍在既有页面）。审计 exception.resolved：object_type=ingest_exception/reconciliation_difference，
        env=LIVE（控制面人工动作），reason=证据摘要（≤200）。CSRF 与 Idempotency-Key 必填（幂等执行器包裹）。
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, enum: [INGEST, RECON, TASK, MAPPING] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: env, in: query, schema: { type: string, enum: [LIVE, MOCK] }, description: '仅用于 TASK 不可解析时的 deepLink 环境；RECON 解析恒按宿主 env' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionResolveRequest' } } }
      responses:
        '200': { description: 已留证关闭, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionResolveResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'ALREADY_RESOLVED / DIFFERENCE_ALREADY_RESOLVED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'VALIDATION（证据为空/超长）或 NOT_RESOLVABLE_VIA_QUEUE（TASK/MAPPING，fieldErrors 附 deepLink）', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ================= M4 Task 5 可观测性（NFR-06 / UI-01 闭环） =================
  /ops/metrics:
    get:
      x-phase: M4
      description: >
        管道健康指标（权限 trace:read；匿名 401）。env 恒为宿主 env（不接受跨 env 查询）。
        只读：不写库、不发平台外呼。口径：jobs 按 outbox_job 状态分组；oldestPendingAgeSeconds=PENDING 最小
        next_run_at 距 now 秒数（未来/空闲→0）；failureRate24h=finished_at>=now-24h 的 FAILED/(DONE+FAILED)，
        分母 0→null；attempts24h 按 upload_attempt.started_at 与 attempt_kind；uploadsToday 按
        upload_task.created_at>=上海今日 00:00（TimeZoneInfo "China Standard Time" 换算为 UTC 参数），
        successRate=succeeded/(succeeded+failed)，分母 0→null；rateBudget 原样回显（limit null=未取证）；
        pauses=is_active=1；leaseRecoveries24h=audit_log action='job.lease.recovered' 且 env 匹配、
        occurred_at>=now-24h（回收审计按作业 env 落库）；recon.incomplete24h=本 env INCOMPLETE 且
        started_at>=now-24h，recon.openDifferences=本 env OPEN 差异全量计数。2008 R2 语法。
      responses:
        '200': { description: 指标快照, content: { application/json: { schema: { $ref: '#/components/schemas/OpsMetricsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/jobs:
    get:
      x-phase: M4
      description: >
        作业状态列表（权限 trace:read；匿名 401）。宿主 env 定界；state 可选（枚举校验，非法 400 VALIDATION）、
        kind 可选（等值）；ROW_NUMBER 区间分页（2008 R2），排序 created_at DESC, id DESC；pageSize 默认 50、上限 100；
        lastError 截断到 200 字符。只读。
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [PENDING, RUNNING, DONE, FAILED, CANCELLED] }, description: '非法值 400' }
        - { name: kind, in: query, schema: { type: string }, description: 'job_kind 精确等值' }
        - { $ref: '#/components/parameters/Page' }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, default: 50 }, description: '1..100；>100 收敛为 100' }
      responses:
        '200': { description: 作业分页, content: { application/json: { schema: { $ref: '#/components/schemas/OpsJobsResponse' } } } }
        '400': { description: 'VALIDATION（state/page/pageSize 非法）', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/alerts:
    get:
      x-phase: M4
      description: >
        派生站内告警（权限 trace:read；匿名 401；只读不写库、不发外呼）。宿主 env 定界。常量阈值：
        BacklogThreshold=100（PENDING>100 → HIGH，>0 且 ≤100 不报）、FailedJobs24hWarn=1 / FailedJobs24hHigh=10
        （JOBS_FAILED_24H：≥1 MEDIUM，≥10 HIGH）、LeaseRecoveryWarn=1（LEASE_RECOVERED_24H → HIGH）、
        IncompleteReconWarn=1（RECON_INCOMPLETE_24H → MEDIUM）。另有 CHANNEL_PAUSED（HIGH，每 scope 一条）、
        RECON_DIFFERENCES_OPEN（MEDIUM，count>0）、RATE_BUDGET_WAITING（MEDIUM，next_allowed_at>now 的预算行数）。
        无告警 → alerts: []。deepLink 指向站内可达面（/ops、/ops?state=FAILED、/audit、/exceptions?category=RECON）。
      responses:
        '200': { description: 告警列表, content: { application/json: { schema: { $ref: '#/components/schemas/OpsAlertsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
